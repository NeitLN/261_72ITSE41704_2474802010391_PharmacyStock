# Requests the default reviewer on every pull request (CONTRIBUTING.md,
# "Pull requests"): Minh for Tiến, Tiến for Duy Anh, Duy Anh for Minh. Since
# 23/10 any other member may review instead. Branch protection on main
# requires one approval before merging.
#
# pull_request_target runs the copy of this file on main with a token that may
# request reviewers. It never checks out the pull request's code.
name: Assign reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const rotation = {
              NeitLN: 'Jayson135724', // Tiến  -> reviewed by Minh
              anh7032: 'NeitLN', // Duy Anh -> reviewed by Tiến
              Jayson135724: 'anh7032', // Minh  -> reviewed by Duy Anh
            };
            const pr = context.payload.pull_request;
            const reviewer = rotation[pr.user.login];
            if (!reviewer) {
              core.info(`No rotation entry for ${pr.user.login}; nothing to do.`);
              return;
            }
            if (pr.requested_reviewers.some((r) => r.login === reviewer)) {
              core.info(`${reviewer} is already requested.`);
              return;
            }
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              reviewers: [reviewer],
            });
            core.info(`Requested a review from ${reviewer}.`);
